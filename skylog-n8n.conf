# Sitio nginx del subdominio n8n: skylog-n8n.redlinegs.com
# Archivo SEPARADO del conf de Django (skylog.conf, que ya gestiona certbot).
#
# Instalación en el VPS:
#   sudo cp skylog-n8n.conf /etc/nginx/sites-available/skylog-n8n.conf
#   sudo ln -s /etc/nginx/sites-available/skylog-n8n.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d skylog-n8n.redlinegs.com   # agrega el bloque 443 (SSL)
#
# Apunta al contenedor n8n (skylog_n8n) publicado en 127.0.0.1:5680.

server {
    listen 80;
    server_name skylog-n8n.redlinegs.com;

    client_max_body_size 20M;

    # Certbot webroot challenge (emisión/renovación del certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5680;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket (requerido por n8n)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
