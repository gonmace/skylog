services:
  postgres:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME}_db
    env_file:
      - .env
    volumes:
      - ./db:/var/lib/postgresql/data/
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./agent/dist:/app/agent/dist:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

  # n8n — opcional, se activa con `--profile n8n` (deploy.sh lo hace si N8N_DOMAIN
  # está definido). Importar workflows con `make n8n-import` (no es automático).
  n8n:
    profiles: [n8n]
    build:
      context: .
      dockerfile: docker/n8n.Dockerfile
    image: ${PROJECT_NAME}_n8n:latest
    container_name: ${PROJECT_NAME}_n8n
    restart: always
    ports:
      - "127.0.0.1:5680:5678"   # privado: nginx (nginx-n8n.conf) proxea el subdominio
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TIME_ZONE:-America/La_Paz}
      # Integración con Django (el workflow lee estas vars via $env)
      DJANGO_INTERNAL_URL: http://django:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_IMPORT_ACTIVE: "true"
      N8N_TRUST_PROXY: "true"
      N8N_PROXY_HOPS: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_LOG_LEVEL: warn
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "false"
    volumes:
      - ./volumes/n8n:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows-import:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  app_network:
