{% extends "base.html" %}
{% load static %}

{% block title %}Acceso restringido — RedLine GS{% endblock %}

{% block content %}
<div class="min-h-screen bg-base-200 flex items-center justify-center p-6">
  <div class="card bg-base-100 shadow-xl w-full max-w-sm">
    <div class="card-body items-center text-center gap-6">

      <div class="w-16 h-16 rounded-full bg-warning/10 border border-warning/20 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-warning" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
      </div>

      <div>
        <h1 class="text-lg font-bold">Acceso a Skylog deshabilitado</h1>
        <p class="text-sm text-base-content/50 mt-2">Tu cuenta no tiene acceso a esta plataforma. Contacta a tu administrador.</p>
      </div>

      <button id="btn-noaccess-logout" class="btn-ghost-tinted btn-sm gap-2 text-error">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Cerrar sesión
      </button>

    </div>
  </div>
</div>

<script>
  (() => {
    const access = localStorage.getItem('access');
    if (!access) { window.location.href = '/login/'; return; }
    document.getElementById('btn-noaccess-logout').addEventListener('click', () => {
      localStorage.removeItem('access');
      localStorage.removeItem('refresh');
      window.location.href = '/login/';
    });
  })();
</script>
{% endblock %}
