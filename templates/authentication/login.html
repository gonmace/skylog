{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<script>
  if (localStorage.getItem('access')) {
    var next = new URLSearchParams(window.location.search).get('next');
    window.location.href = next || '/dashboard/';
  }
</script>

<div class="min-h-screen bg-base-200 flex items-center justify-center p-6">
  <div class="card bg-base-100 shadow-xl w-full max-w-sm">
    <div class="card-body items-center gap-7">

      <div class="flex flex-col items-center gap-3">
        <img src="{% static 'img/logo_RL.png' %}" alt="RedLine GS" class="h-14 w-auto object-contain">
        <p class="text-sm text-base-content/50">skylog system</p>
      </div>

      <a href="{% url 'authentication:oauth2_authorize' %}" class="btn-tinted w-full gap-2 text-primary">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
        </svg>
        Entrar con Nextcloud
      </a>

      <div id="local-login-section" class="w-full flex flex-col gap-4">
        <div class="divider text-xs text-base-content/40 my-0">o</div>

        <div class="flex flex-col gap-3">
          <input id="login-username" type="text" placeholder="Usuario"
            autocomplete="username" autocapitalize="none"
            class="input input-bordered w-full">
          <input id="login-password" type="password" placeholder="Contraseña"
            autocomplete="current-password"
            class="input input-bordered w-full">

          <div id="login-error" class="alert alert-error text-sm py-2 hidden">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span id="login-error-text"></span>
          </div>

          <button id="login-submit" class="btn-tinted w-full text-success" onclick="doLogin()">
            Iniciar sesión
          </button>
        </div>
      </div>

      <p class="text-xs text-base-content/40 text-center">
        Usa tu cuenta de <span class="text-base-content/60">sky.redlinegs.com</span>
      </p>

    </div>
  </div>
</div>

<script>
  if (window.self !== window.top) {
    document.getElementById('local-login-section').style.display = 'none';
  }

  const usernameInput = document.getElementById('login-username');
  const passwordInput = document.getElementById('login-password');
  const submitBtn     = document.getElementById('login-submit');
  const errorBox      = document.getElementById('login-error');
  const errorText     = document.getElementById('login-error-text');

  [usernameInput, passwordInput].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  });

  async function doLogin() {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    errorBox.classList.add('hidden');

    if (!username || !password) { showError('Ingresa usuario y contraseña.'); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Ingresando…';

    try {
      const resp = await fetch('/api/auth/mobile-login/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await resp.json();

      if (!resp.ok) { showError(data.error || 'Usuario o contraseña incorrectos.'); return; }

      localStorage.setItem('access', data.access);
      localStorage.setItem('refresh', data.refresh);
      window.location.href = data.solo_movil ? '/mobile/' : '/dashboard/';

    } catch {
      showError('Error de conexión. Intenta de nuevo.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Iniciar sesión';
    }
  }

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.remove('hidden');
  }
</script>
{% endblock %}
